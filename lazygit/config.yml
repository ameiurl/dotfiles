os:
  # 使用 nvim-remote 预设
  # 这会让 lazygit 识别 $NVIM 环境变量，利用 RPC 通信在父窗口打开文件
  # editPreset: 'nvim-remote'

  editPreset: ""
  # edit: "nvim --server $NVIM --remote {{filename}}"
  edit: >
    if [ -n "$NVIM" ]; then
      nvim --server "$NVIM" --remote-send '<C-\><C-n><cmd>close<CR>' &&
      nvim --server "$NVIM" --remote {{filename}};
    else
      nvim {{filename}};
    fi
  editInTerminal: false
